[project]
name = "hexlet-code"
version = "0.1.0"
description = "Calculadora de diferencias"
authors = [
    {name = "chalo-nov", email = "jcn1708@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyyaml (>=6.0.3,<7.0.0)"]

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "gendiff" }
]
[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
